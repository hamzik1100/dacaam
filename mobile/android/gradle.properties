# 3G, not 8G. This machine has 16G total and runs Chrome and an emulator
# alongside the build; asking for an 8G heap plus 4G metaspace crashed the
# daemon outright with "insufficient memory for the Java Runtime Environment"
# when free memory was down to 1.4G. A Flutter Android build does not need
# anything like 8G, so the larger figure bought nothing and cost a build.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The pub cache (C:) and this project live on different drives. Kotlin's
# incremental compiler builds relative paths between the two and Windows
# cannot relativise across drive roots, so it crashes closing its caches.
# Release builds do not benefit from incremental compilation anyway.
kotlin.incremental=false
